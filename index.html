<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>My AR Photo Video</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000
}

#start{
  position:fixed;
  z-index:20;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:15px 24px;
  border:0;
  border-radius:12px;
  font-size:18px
}

#msg{
  position:fixed;
  z-index:19;
  left:10px;
  right:10px;
  bottom:18px;
  text-align:center;
  color:white;
  font:15px Arial;
  text-shadow:0 1px 4px #000
}
</style>
</head>

<body>

<button id="start">START AR</button>

<div id="msg">Camera को target photo पर रखें</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement:true; physicallyCorrectLights:true; antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-assets>
    <video
      id="memoryVideo"
      src="./video.mp4"
      preload="auto"
      loop
      playsinline
      webkit-playsinline
      muted>
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled:false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex:0">

    <a-video
      src="#memoryVideo"
      position="0 0 0.01"
      width="2.4"
      height=1.35>
    </a-video>

  </a-entity>

</a-scene>

<script>

const target =
  document.querySelector('[mindar-image-target]');

const video =
  document.querySelector('#memoryVideo');

const start =
  document.querySelector('#start');

start.onclick = async () => {

  start.style.display = 'none';

  try {
    await video.play();
    video.pause();
    video.currentTime = 0;
  }

  catch(e) {
    console.log(e);
  }
};

target.addEventListener('targetFound', async () => {

  document.querySelector('#msg').textContent =
    'Photo detected — video चल रही है';

  try {
    await video.play();
  }

  catch(e) {
    console.log(e);
  }

});

target.addEventListener('targetLost', () => {

  document.querySelector('#msg').textContent =
    'Photo को camera के सामने रखें';

  video.pause();

});

</script>

</body>
</html>
