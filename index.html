<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>AR Photo Video</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

#start{
  position:fixed;
  z-index:20;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:15px 24px;
  border:0;
  border-radius:12px;
  font-size:18px;
}

#msg{
  position:fixed;
  z-index:19;
  left:10px;
  right:10px;
  bottom:18px;
  text-align:center;
  color:white;
  font:15px Arial;
  text-shadow:0 1px 4px #000;
}
</style>

</head>

<body>

<button id="start">START AR</button>

<div id="msg">START AR दबाएँ</div>

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-assets>

    <video
      id="memoryVideo"
      src="./video.mp4"
      preload="auto"
      loop
      playsinline
      webkit-playsinline
      muted
      crossorigin="anonymous">
    </video>

  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled:false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex:0">

    <a-video
      id="videoPlane"
      src="#memoryVideo"
      position="0 0 0.01"
      width="1"
      height="0.424242"
      material="shader: flat">
    </a-video>

  </a-entity>

</a-scene>


<script>

/* ================================
   SUPABASE DETAILS
   ================================ */

const SUPABASE_URL =
"https://uoppiicvfhuukxmhajil.supabase.co
";

const SUPABASE_KEY =
"sb_publishable_V_tmzVv_YiYURCwVCp9wMA_ZFP7-stm";


/* ================================
   ELEMENTS
   ================================ */

const scene = document.querySelector("#scene");
const target = document.querySelector("#target");
const video = document.querySelector("#memoryVideo");
const start = document.querySelector("#start");
const msg = document.querySelector("#msg");


/* ================================
   LOAD CUSTOMER DATA
   ================================ */

async function loadCustomer(){

  msg.textContent = "Customer data लोड हो रहा है...";

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/ar_customers?select=target_file,video_file&limit=1",
      {
        headers:{
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!response.ok){
      throw new Error("Supabase error: " + response.status);
    }

    const data = await response.json();

    if(!data || data.length === 0){
      throw new Error("Customer data नहीं मिली");
    }

    const customer = data[0];

    const targetFile = customer.target_file;
    const videoFile = customer.video_file;

    /* Set target file */

    scene.setAttribute(
      "mindar-image",
      "imageTargetSrc: ./" + targetFile + "; autoStart: false;"
    );

    /* Set video file */

    video.src = "./" + videoFile;
    video.load();

    msg.textContent = "Customer 001 तैयार है";

    return true;

  }catch(error){

    console.error(error);

    msg.textContent =
      "Database से data नहीं मिला: " + error.message;

    return false;
  }
}


/* ================================
   START AR
   ================================ */

start.addEventListener("click", async () => {

  start.style.display = "none";

  const loaded = await loadCustomer();

  if(!loaded){
    start.style.display = "block";
    return;
  }

  try{

    await video.play();
    video.pause();
    video.currentTime = 0;

  }catch(e){}

  msg.textContent = "Camera शुरू हो रहा है...";

  try{

    const mindarSystem =
      scene.systems["mindar-image-system"];

    await mindarSystem.start();

  }catch(error){

    console.error(error);

    msg.textContent =
      "AR start नहीं हुआ: " + error.message;
  }

});


/* ================================
   TARGET FOUND
   ================================ */

target.addEventListener("targetFound", async () => {

  msg.textContent =
    "Photo detected — video चल रही है";

  try{
    await video.play();
  }catch(e){}

});


/* ================================
   TARGET LOST
   ================================ */

target.addEventListener("targetLost", () => {

  msg.textContent =
    "Photo को camera के सामने रखें";

  video.pause();

});

</script>

</body>
</html>
